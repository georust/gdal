[package]
name = "gdal-sys"
description = "Low level GDAL bindings for Rust"
license = "MIT"
version = "0.12.0"
repository = "https://github.com/georust/gdal"
authors = ["Johannes Drönner <droenner@informatik.uni-marburg.de>"]
categories = ["science::geo", "api-bindings"]
edition = "2024"
rust-version = "1.88"
links = "gdal"

[dependencies]
gdal-src = { version = "0.3", path = "../gdal-src/", optional = true }

[build-dependencies]
bindgen = { version = "0.73", optional = true }
pkg-config = "0.3"
semver = "1.0"


[features]
default = []
bundled = ["dep:gdal-src"]
bundled-driver-sqlite = ["bundled", "gdal-src/driver_sqlite"]
bundled-all-drivers = ["bundled", "gdal-src/all_drivers"]
bundled-geos-static = ["bundled", "gdal-src/geos_static"]
